name: deploy

# Push to `main`  -> build + verify + PRODUCTION deploy to Cloudflare Pages (whatping.com/www).
#
# Runs on a SELF-HOSTED runner (`nh-4c8g-318` = the production VM 10.1.30.29), as the non-root
# `ghrunner` user. There is deliberately NO `pull_request` trigger: a self-hosted runner executes
# workflow code on the box, so we never let an unmerged PR run on the production host. Only pushes
# to `main` (already-merged, trusted code) run here. The CF token still lives in the `main`-only
# `production` GitHub Environment, referenced solely by the deploy job.
#
# On-demand previews / PR validation are a workstation task: `DEPLOY_BRANCH=<x> bash
# deploy/cf-pages-deploy.sh`. Domain / DNS / apex->www redirect changes also stay on the
# workstation (broader token; touch a zone carrying live mail). See deploy/CI.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a production publish mid-flight; do coalesce redundant PR/branch runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: [self-hosted, whatping]
    steps:
      - uses: actions/checkout@v4

      # This is a bun repo (npm/yarn/pnpm lockfiles are gitignored so they can't switch the
      # builder). No lockfile is committed, so `bun install` resolves from package.json; the
      # build + verify gate below fails the run before any deploy if a resolution regresses.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install

      # astro build -> dist/. Must precede verify: verify-routes.py asserts every content route
      # exists in dist/.
      - run: bun run build

      # Pure-stdlib gate (routes + contrast + api-examples; python3 ships on ubuntu-latest).
      # A red verify fails the run here, before the deploy job is ever reached.
      - run: bun run verify

      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    # Production only. The `if` and the environment's main-only branch policy are belt-and-braces.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, whatping]
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      # Node runtime deliberately (wrangler-action runs wrangler under Node). NEVER `bunx --bun`
      # wrangler: under Bun it prints its banner, uploads nothing, and exits 0 — a silent no-op.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name whatping-marketing --branch main --commit-dirty=true
