name: deploy

# Push to `main`  -> build + verify + PRODUCTION deploy to Cloudflare Pages (whatping.com/www).
# Pull request     -> build + verify ONLY. No deploy, no secret in scope: the CF token lives in
#                     the `production` GitHub Environment, which is restricted to the `main`
#                     branch, so a PR-branch run (including one that edited this workflow) is
#                     denied it by GitHub. That is the exfiltration guard — keep it.
#
# On-demand previews are a workstation task: `DEPLOY_BRANCH=<x> bash deploy/cf-pages-deploy.sh`.
# Domain / DNS / apex->www redirect changes also stay on the workstation (they need a broader
# token and touch a zone carrying live mail). See deploy/CI.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a production publish mid-flight; do coalesce redundant PR/branch runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is a bun repo (npm/yarn/pnpm lockfiles are gitignored so they can't switch the
      # builder). No lockfile is committed, so `bun install` resolves from package.json; the
      # build + verify gate below fails the run before any deploy if a resolution regresses.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install

      # astro build -> dist/. Must precede verify: verify-routes.py asserts every content route
      # exists in dist/.
      - run: bun run build

      # Pure-stdlib gate (routes + contrast + api-examples; python3 ships on ubuntu-latest).
      # A red verify fails the run here, before the deploy job is ever reached.
      - run: bun run verify

      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    # Production only. The `if` and the environment's main-only branch policy are belt-and-braces.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      # Node runtime deliberately (wrangler-action runs wrangler under Node). NEVER `bunx --bun`
      # wrangler: under Bun it prints its banner, uploads nothing, and exits 0 — a silent no-op.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name whatping-marketing --branch main --commit-dirty=true
